  <path d="M 51,60 Q 38,70 32,80" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 51,68 Q 62,76 68,82" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>