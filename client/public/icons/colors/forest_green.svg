  <!-- Pine Needles Luster -->
  <path d="M 50,22 L 50,70" stroke="#6EE7B7" stroke-width="1.5" opacity="0.7"/>
  <circle cx="42" cy="42" r="2" fill="#BBF7D0" opacity="0.8"/>
