<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mahoganyGrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65518"/>
      <stop offset="50%" stop-color="#C04000"/>
      <stop offset="100%" stop-color="#661D00"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#FAF5F0" stroke="#a72700" stroke-width="2.5"/>
